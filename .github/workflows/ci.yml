name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          # - macos-latest   # TODO: Enable when ready
          # - windows-latest # TODO: Enable when ready
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Run vet
        run: go vet ./...

      - name: Verify patched parser identity
        run: python3 scripts/check_parser_pin.py --go "$(command -v go)"

      - name: Test parser pin and cloud boundaries
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py'

      - name: Test patched parser upstream corpus
        run: go -C third_party/go-toml test -race -count=1 ./...

      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.out

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pin to v2.x to match .golangci.yml version: "2" format
          # Keep in sync with local development version
          version: v2.6.1
